description: "LLM Evaluation Pipeline"
providers:
  - id: openai:gpt-4o
    label: GPT-4o
    config: {temperature: 0.1, max_tokens: 500}
  - id: openai:gpt-4o-mini
    label: GPT-4o-mini
    config: {temperature: 0.1, max_tokens: 500}
  - id: openai:gpt-3.5-turbo
    label: GPT-3.5-baseline
    config: {temperature: 0.1, max_tokens: 500}
prompts:
  - file://prompts/customer_support_v1.txt
  - file://prompts/customer_support_v2.txt
tests: file://datasets/support_tests.yaml
defaultTest:
  assert:
    - type: llm-rubric
      value: "Professional, helpful, addresses concern"
    - type: cost
      threshold: 0.05
    - type: latency
      threshold: 5000
outputPath: ../reports/eval_results.json
