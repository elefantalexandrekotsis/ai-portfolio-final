version: "3.8"
services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    env_file: [.env]
    depends_on:
      postgres: {condition: service_healthy}
  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    environment: [NEXT_PUBLIC_API_URL=http://localhost:8000]
    depends_on: [backend]
  postgres:
    image: pgvector/pgvector:pg16
    ports: ["5432:5432"]
    environment: {POSTGRES_DB: ai_support, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U postgres"], interval: 5s, timeout: 5s, retries: 5}
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  postgres_data:
